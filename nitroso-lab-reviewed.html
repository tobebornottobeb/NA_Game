ism`,number:11,name:`Minakata, Coscarelli · фотолиз и продукты`,url:`https://pmc.ncbi.nlm.nih.gov/articles/PMC6017648/`,detail:`Mechanistic Insight into the Degradation of Nitrosamines via Aqueous-Phase UV Photolysis or a UV-Based Advanced Oxidation Process: Quantum Mechanical Calculations. Molecules 23(3):539, 2018. DOI: 10.3390/molecules23030539. Введение и раздел о фотолизе NDMA: расщепление N–N и образование различных продуктов. Это расчётное исследование с сопоставлением экспериментальных данных, не гарантия обезвреживания.`},{id:`transnitrosation`,number:12,name:`Pessêgo и соавт. · перенос группы и фенолы`,url:`https://pmc.ncbi.nlm.nih.gov/articles/PMC3053510/`,detail:`Importance of phenols structure on their activity as antinitrosating agents: A kinetic study. Journal of Pharmacy and Bioallied Sciences 3(1):128–134, 2011. DOI: 10.4103/0975-7406.76491. Введение: перенос нитрозогруппы от доноров, конкурирующие процессы и зависимость действия фенолов от условий. Общая схема не обещает перенос между любыми веществами.`},{id:`physical-analytical`,number:13,name:`Обзор аналитики · свойства и резонансные записи`,url:`https://pmc.ncbi.nlm.nih.gov/articles/PMC7056657/`,detail:`Application of chromatographic techniques in the analysis of total nitrosamines in water. Heliyon 6:e03447, 2020. DOI: 10.1016/j.heliyon.2020.e03447. Введение, схемы строения и резонанса (рис. 1–2), различия летучих и нелетучих соединений. Исторические допустимые уровни и выводы о металл-нитрозильных комплексах в игру не перенесены.`}],t=[{id:`agents`,chapterId:`formation`,defaultMolecule:3,short:`Найти активную частицу`,label:`Нитрозирующие частицы`,tag:`ИСТОЧНИК ГРУППЫ`,minutes:`3 мин`,title:`Нитрит — начало.
Путь важнее названия.`,lead:`Различите источник азота и частицу, которая участвует в нитрозировании.`,notebook:`Нитрозирующий агент зависит от среды`,sourceIds:[`pathways`,`efsa-risk`],paragraphs:[`В водной системе нитрит может переходить в азотистую кислоту HNO₂, из которой образуются активные нитрозирующие частицы, например N₂O₃. Наличие нитрита само по себе ещё не задаёт скорость и продукты.`,`Другие пути связаны с оксидами азота и органическими нитритами. Не следует отождествлять NO, NO₂, N₂O₃ и нитрит-ион: их свойства и участие в реакции различаются.`,`NO сам по себе не является эффективным универсальным нитрозирующим агентом. Его превращения, например при участии кислорода, могут приводить к другим активным частицам. Сравните ситуации в панели ниже.`],takeaway:`Важно не только наличие предшественников, но и образование активной нитрозирующей частицы.`,experiment:{title:`Сравните источники`,options:[{label:`Нитрит в водной среде`,tag:`РАВНОВЕСИЯ`,formula:`NO₂⁻ ⇌ HNO₂ → активные частицы`,message:`Концептуальная схема, а не суммарное уравнение. В кислой среде меняются доли HNO₂ и непротонированного амина.`},{label:`Оксиды азота`,tag:`РАЗНЫЕ ЧАСТИЦЫ`,formula:`NO ≠ NO₂ ≠ N₂O₃`,message:`Оксиды азота не взаимозаменяемы. Активные нитрозирующие частицы могут возникать при их превращениях; наличие NO не гарантирует реакцию.`},{label:`Органический нитрит`,tag:`ДРУГОЙ ИСТОЧНИК`,formula:`R–O–N=O`,message:`Органический нитрит имеет другое строение, чем N-нитрозамин R₂N–N=O. Возможность переноса нитрозогруппы зависит от условий.`}]},questions:[{title:`Какую частицу обсуждают как нитрозирующую?`,text:`Речь о частицах, возникающих в системе нитрит / азотистая кислота.`,options:[`N₂O₃`,`Любую соль нитрата без превращений`,`Только молекулярный азот N₂`],answer:0,explanation:`N₂O₃ — один из возможных нитрозирующих агентов. Нитрат и молекулярный азот не заменяют его напрямую в этой модели.`},{title:`Наличие NO гарантирует нитрозирование амина?`,text:`Выберите вывод, учитывающий превращения оксидов азота.`,options:[`Да, NO и N₂O₃ — одна частица`,`Нет: важны превращения в активные частицы и условия`,`Да, состав среды не влияет`],answer:1,explanation:`NO сам по себе не является универсальным эффективным нитрозирующим агентом. Важны его превращения и состав среды, а не только название исходного оксида.`}]},{id:`precursors`,chapterId:`formation`,defaultMolecule:3,short:`Различить предшественники`,label:`Другие азотсодержащие вещества`,tag:`СЕМЕЙСТВО ШИРЕ`,minutes:`4 мин`,title:`Один атом азота.
Много разных продуктов.`,lead:`Узнайте, почему не каждый N-нитрозопродукт является нитрозамином.`,notebook:`Названия классов имеют значение`,sourceIds:[`substrates-qsar`,`pathways`,`efsa-risk`],paragraphs:[`Нитрозироваться могут не только простые амины: рассматривают также амиды, мочевины и другие азотсодержащие группы. Их реакционная способность зависит от электронного строения.`,`Продукт нитрозирования амидной группы — N-нитрозамид, а не просто ещё один N-нитрозамин. Оба относятся к N-нитрозосоединениям, но это разные классы со своими свойствами.`,`Аминокислоты и сложные молекулы тоже могут быть предшественниками. Например, у пролина есть вторичный аминный азот. Строение и последующие превращения нужно оценивать отдельно, без правила «любое вещество с азотом даёт один продукт».`],takeaway:`N-нитрозосоединения — более широкое семейство, чем N-нитрозамины.`,experiment:{title:`Разберите функциональные группы`,options:[{label:`Вторичная аминная группа`,tag:`АМИН`,formula:`R₂NH → R₂N–N=O`,message:`Обычная учебная схема нитрозамина. Стрелка показывает тип превращения, а не протокол или гарантированный выход.`},{label:`Амидная группа`,tag:`ДРУГОЙ КЛАСС`,formula:`R–C(=O)–NH–R′`,message:`При N-нитрозировании амидного азота получают N-нитрозамид. Карбонильная группа влияет на электронное строение; свойства обычного нитрозамина нельзя переносить автоматически.`},{label:`Аминокислота`,tag:`ВАЖНО СТРОЕНИЕ`,formula:`Пролин ≠ любая аминокислота`,message:`Пролин содержит вторичный аминный азот. У разных аминокислот число заместителей и возможные пути превращений различаются.`}]},questions:[{title:`N-нитрозамин и N-нитрозамид — один класс?`,text:`Учтите наличие карбонильной группы у амидного азота.`,options:[`Да, приставка N- делает их одинаковыми`,`Нет, это разные классы N-нитрозосоединений`,`Оба названия означают нитрат`],answer:1,explanation:`Они относятся к более широкому семейству N-нитрозосоединений, но амидная группа меняет строение и свойства. Их нельзя считать взаимозаменяемыми.`},{title:`Что нужно знать о сложном предшественнике?`,text:`Выберите основание для оценки возможного нитрозирования.`,options:[`Только общее число атомов азота`,`Только цвет вещества`,`Функциональные группы, электронное строение и возможные превращения`],answer:2,explanation:`Сам факт наличия азота не определяет продукт. Важны тип группы, доступность электронов и пути, включая возможное расщепление или деалкилирование.`}]},{id:`transfer`,chapterId:`formation`,defaultMolecule:3,short:`Проследить перенос`,label:`Перенитрозирование и промоторы`,tag:`СМЕНА МАРШРУТА`,minutes:`4 мин`,title:`Группа переходит.
Среда направляет.`,lead:`Различите перенос нитрозогруппы и изменение скорости её образования.`,notebook:`Донор и промотор — разные роли`,sourceIds:[`transnitrosation`,`pathways`,`efsa-risk`],paragraphs:[`В отдельных системах нитрозогруппа может переноситься от нитрозосоединения-донора к другому субстрату. Такой процесс называют перенитрозированием. Это возможность для определённых доноров и условий, а не свободный перенос между любыми молекулами.`,`Промоторы и катализаторы влияют на путь или скорость нитрозирования. Например, некоторые карбонильные соединения позволяют протекать реакциям в условиях, отличных от простой кислой водной системы.`,`Действие фенольных соединений зависит от строения, концентраций и среды: в различных системах описаны как ингибирование, так и каталитическое действие. Название вещества не заменяет условия эксперимента.`],takeaway:`Перенос группы, катализ и ингибирование описывают разные химические роли.`,experiment:{title:`Определите роль процесса`,options:[{label:`Перенос от донора`,tag:`ПЕРЕНИТРОЗИРОВАНИЕ`,formula:`Донор NO-группы → акцептор`,message:`Схема возможного переноса. Конкретная реакция требует подходящих веществ и условий; она не устанавливает безопасность донора или продукта.`},{label:`Изменение пути`,tag:`ПРОМОТОР`,message:`Промотор может изменить доступные промежуточные частицы и скорость. Это не обязательно источник нитрозогруппы.`},{label:`Конкуренция за частицы`,tag:`ИНГИБИРОВАНИЕ`,message:`Соединение может расходовать активные нитрозирующие частицы, уменьшая их доступность для амина. Результат зависит от всей системы.`}]},questions:[{title:`Что означает перенитрозирование?`,text:`Выберите определение процесса, а не изменение pH.`,options:[`Перенос нитрозогруппы от подходящего донора к другому субстрату`,`Только испарение готового нитрозамина`,`Превращение нитрата в азот N₂ без других веществ`],answer:0,explanation:`Перенитрозирование описывает перенос нитрозогруппы. Оно зависит от химии донора и акцептора; не означает, что любой нитрозамин легко отдаёт эту группу.`},{title:`Фенолы всегда тормозят нитрозирование?`,text:`Учтите различия структуры и условий.`,options:[`Да, все фенолы действуют одинаково`,`Нет, в разных системах возможно и ингибирование, и каталитическое действие`,`Нет, все фенолы всегда ускоряют`],answer:1,explanation:`В литературе описаны разные направления эффекта. Для вывода нужны строение фенола, состав среды и соотношение реагирующих веществ.`}]},{id:`inhibition`,chapterId:`formation`,defaultMolecule:3,short:`Учесть среду`,label:`Ингибирование и состав системы`,tag:`КОНТЕКСТ РЕШАЕТ`,minutes:`4 мин`,title:`Ингибитор — роль.
Не обещание безопасности.`,lead:`Узнайте, почему эффект ингибитора проверяют в конкретной среде.`,notebook:`Водная и жировая фазы отличаются`,sourceIds:[`efsa-risk`,`ascorbate-context`],paragraphs:[`В ряде водных систем аскорбиновая кислота уменьшает нитрозирование, взаимодействуя с нитрозирующими частицами. EFSA описывает применение аскорбатов и эриторбатов для уменьшения образования некоторых нитрозаминов в продуктах.`,`Но эффект зависит от состава и фаз. В исследовании Combet и соавторов добавление жировой фазы в лабораторную модель могло менять действие аскорбиновой кислоты с ингибирующего на способствующее нитрозированию.`,`Этот результат не означает, что витамин C всегда вреден или всегда защищает. И ингибирование образования, и разрушение уже образованного вещества — отдельные процессы. В игре сравниваются химические ситуации, а не способы лечения или приготовления пищи.`],takeaway:`Эффект ингибитора нужно подтверждать для конкретных веществ, среды и условий.`,experiment:{title:`Сравните среды`,options:[{label:`Водная модель`,tag:`ВОЗМОЖНО ИНГИБИРОВАНИЕ`,message:`Для ряда водных систем аскорбиновая кислота уменьшает доступность нитрозирующих частиц. Это описание эффекта, а не гарантии для любого состава.`},{label:`Модель с жировой фазой`,tag:`ЭФФЕКТ МОЖЕТ ИЗМЕНИТЬСЯ`,message:`В опубликованной лабораторной модели жировая фаза меняла направление действия аскорбата. Переносить этот результат на любой рацион или препарат нельзя.`}]},questions:[{title:`Почему нельзя обещать универсальную защиту аскорбатом?`,text:`Оцените данные лабораторной модели.`,options:[`Потому что аскорбат всегда ускоряет любую реакцию`,`Потому что он вообще не взаимодействует с нитрозирующими частицами`,`Потому что эффект зависит от среды, фаз и состава системы`],answer:2,explanation:`Ингибирующее действие наблюдается в определённых системах. Наличие другой фазы и распределение реагентов могут изменить результат; это не универсальная рекомендация.`},{title:`Ингибирование образования равно удалению готового нитрозамина?`,text:`Различите два процесса.`,options:[`Нет, предотвращение образования и превращение готового вещества — разные процессы`,`Да, они всегда обозначают одну реакцию`,`Да, ингибитор обязательно уничтожает все продукты`],answer:0,explanation:`Ингибитор образования может действовать на предшественники или активные частицы. Это ещё не доказывает разрушение уже существующего нитрозамина и безопасность всех продуктов.`}]},{id:`physical`,chapterId:`properties`,defaultMolecule:3,short:`Сравнить свойства`,label:`Летучесть и физические свойства`,tag:`НЕ ВСЕ ОДИНАКОВЫ`,minutes:`3 мин`,title:`Общее семейство.
Разные свойства.`,lead:`Различите летучесть, фазовый переход и химическое превращение.`,notebook:`Свойства относятся к конкретному веществу`,sourceIds:[`efsa-risk`,`physical-analytical`],paragraphs:[`Нельзя считать все нитрозамины одинаково летучими. В обзоре EFSA соединения условно разделены на летучие и нелетучие по температуре кипения с границей 250 °C.`,`В таблице EFSA для NDMA указано 156 °C, для NDBA — 271 °C. Это пример классификации в отчёте, а не универсальная граница поведения веществ при любой температуре.`,`Летучесть и растворимость — разные характеристики. Кипение является фазовым переходом, а разрыв N–N — химическим превращением. Из температуры кипения нельзя вывести растворимость, токсичность или безопасность.`],takeaway:`Физическое свойство и химическая реакция — не одно и то же.`,experiment:{title:`Прочитайте данные о веществах`,options:[{label:`NDMA`,tag:`ПО КЛАССИФИКАЦИИ EFSA — ЛЕТУЧИЙ`,formula:`Температура кипения: 156 °C`,message:`Значение приведено в таблице EFSA. На столе показан общий фрагмент нитрозамина, а не расчётная молекула NDMA.`},{label:`NDBA`,tag:`ПО КЛАССИФИКАЦИИ EFSA — НЕЛЕТУЧИЙ`,formula:`Температура кипения: 271 °C`,message:`«Нелетучий» здесь — условная классификация отчёта с границей 250 °C. Это не означает полного отсутствия испарения при любых условиях.`},{label:`Что из этого не следует?`,tag:`ГРАНИЦЫ ДАННЫХ`,message:`Температура кипения не определяет автоматически растворимость, скорость распада или канцерогенную активность.`}]},questions:[{title:`Все нитрозамины можно считать летучими?`,text:`Используйте классификацию, а не общее название класса.`,options:[`Да, у всех одинаковая температура кипения`,`Нет, в EFSA выделены летучие и нелетучие соединения`,`Да, слово «нитрозамин» означает газ`],answer:1,explanation:`Общий структурный фрагмент не делает физические свойства одинаковыми. Классификация EFSA использует условную границу температуры кипения.`},{title:`Кипение доказывает разрыв связи N–N?`,text:`Различите фазовый переход и химическую реакцию.`,options:[`Нет: кипение и химическое расщепление — разные процессы`,`Да: любая молекула разрушается при испарении`,`Да: отсутствие жидкости доказывает обезвреживание`],answer:0,explanation:`Переход в паровую фазу не равен денитрозированию или другой реакции. Ни испарение, ни исчезновение исходной фазы сами по себе не доказывают безопасность.`}]},{id:`resonance`,chapterId:`properties`,defaultMolecule:3,short:`Прочитать электроны`,label:`Резонансные записи строения`,tag:`ФОРМУЛА НЕ ФОТОГРАФИЯ`,minutes:`3 мин`,title:`Две записи.
Одна молекула.`,lead:`Прочитайте электронные записи нитрозаминного фрагмента без подмены их химической реакцией.`,notebook:`Резонанс меняет запись, а не атомы`,sourceIds:[`physical-analytical`,`fda-guidance`],paragraphs:[`Фрагмент нитрозамина можно описывать предельными резонансными записями R₂N–N=O и R₂N⁺=N–O⁻. Они показывают разные распределения электронов и формальных зарядов при том же расположении атомов.`,`Это не два вещества, которые по очереди превращаются друг в друга. Реальная электронная структура не равна одной изолированной предельной записи; такие записи помогают описывать делокализацию.`,`Знак резонанса ↔ отличается от стрелки химического превращения. Формулы ниже — электронные схемы; 3D-модель не рассчитывает заряды, длины связей или вращательные барьеры.`],takeaway:`Резонансные записи описывают одно строение и не означают перемещения атомов.`,experiment:{title:`Сравните электронные записи`,options:[{label:`Нейтральная запись`,tag:`ПРЕДЕЛЬНАЯ ФОРМА`,formula:`R₂N–N=O`,message:`Одна из электронных записей. Она не означает, что реальные связи во всех отношениях совпадают с изолированными одинарной и двойной связями.`},{label:`Запись с зарядами`,tag:`ТА ЖЕ СВЯЗНОСТЬ АТОМОВ`,formula:`R₂N⁺=N–O⁻`,message:`Изменены формальные заряды и расположение электронных пар; ни один атом не перемещён и состав молекулы не изменён.`},{label:`Обе записи вместе`,tag:`РЕЗОНАНС, НЕ РЕАКЦИЯ`,formula:`R₂N–N=O ↔ R₂N⁺=N–O⁻`,message:`Это способ описания электронной структуры одного фрагмента. Стрелка здесь не обозначает стадии синтеза или равновесие двух отдельных веществ.`}]},questions:[{title:`Что означают эти резонансные записи?`,text:`R₂N–N=O ↔ R₂N⁺=N–O⁻`,options:[`Два разных вещества с разными атомами`,`Две записи электронного строения одного фрагмента`,`Две стадии нагревания вещества`],answer:1,explanation:`Связность атомов сохраняется. Меняются электронная запись и формальные заряды, а не состав вещества или положения ядер.`},{title:`Какой признак совместим с резонансом?`,text:`Отделите электронную запись от реакции.`,options:[`Кислород исчезает из состава`,`Один заместитель переходит на другой атом`,`Атомы связаны в том же порядке, меняется распределение электронов`],answer:2,explanation:`Резонансные формы имеют одинаковую связность атомов. Перемещение атомов или изменение состава уже не является просто другой резонансной записью.`}]},{id:`transformations`,chapterId:`properties`,defaultMolecule:3,short:`Изучить превращения`,label:`Денитрозирование, свет и окисление`,tag:`ИСЧЕЗНОВЕНИЕ — НЕ ФИНАЛ`,minutes:`4 мин`,title:`Связь меняется.
Проверка продолжается.`,lead:`Узнайте, какие превращения возможны и почему нужно исследовать продукты.`,notebook:`Разложение не равно полной безопасности`,sourceIds:[`pathways`,`uv-mechanism`,`efsa-risk`],paragraphs:[`Химические превращения нитрозаминов могут идти с сохранением или с расщеплением N–N. При денитрозировании удаляется нитрозогруппа; восстановление может давать производные гидразина или амины, а окисление — другие продукты.`,`Для NDMA исследован фотолиз: поглощение УФ-излучения может приводить к разрыву N–N. Состав продуктов зависит от условий; обычное освещение не заменяет проверенный процесс обработки.`,`УФ, восстановление или исчезновение исходного сигнала анализа не доказывают полной безопасности. Нужно учитывать продукты, возможные остатки и повторное образование нитрозаминов. Обобщение старого текста «продукты нетоксичны» здесь не используется.`],takeaway:`Оценивать нужно исходное вещество, продукты и условия превращения.`,experiment:{title:`Сравните направления превращений`,options:[{label:`Денитрозирование`,tag:`УДАЛЕНИЕ НИТРОЗОГРУППЫ`,formula:`R₂N–N=O → амин + другие продукты`,message:`Концептуальное направление, не суммарное уравнение. Условия и полный набор продуктов нужно определять отдельно.`},{label:`Фотолиз NDMA`,tag:`ВОЗМОЖЕН РАЗРЫВ N–N`,message:`УФ-фотолиз может разрушать исходную молекулу и формировать разные промежуточные и конечные продукты. Из этого не следует автоматическое обезвреживание любой смеси.`},{label:`Восстановление`,tag:`ПРОДУКТЫ ЗАВИСЯТ ОТ УСЛОВИЙ`,message:`Возможны производные гидразина и амины. Сохранение или разрыв N–N зависит от пути реакции; слово «восстановление» не гарантирует нетоксичный результат.`}]},questions:[{title:`Какую связь может расщеплять УФ-фотолиз NDMA?`,text:`Учтите расположение нитрозогруппы.`,options:[`Связь N–N`,`Только связь между двумя углеродными заместителями`,`Никакие связи: свет всегда лишь нагревает`],answer:0,explanation:`Для NDMA описаны пути фотолиза с расщеплением N–N. Возможность процесса и его продукты зависят от условий и не доказывают полную безопасность смеси.`},{title:`Исходный нитрозамин исчез из анализа. Что проверить?`,text:`Выберите следующий исследовательский шаг.`,options:[`Ничего: все продукты обязательно нетоксичны`,`Состав продуктов, остатки и возможное повторное образование`,`Только цвет раствора`],answer:1,explanation:`Исчезновение исходного вещества не характеризует все продукты. Например, при фотолизе NDMA могут образовываться амины и другие вещества, а компоненты среды способны участвовать в последующих реакциях.`}]},{id:`activation`,chapterId:`properties`,defaultMolecule:3,short:`Связать химию и ДНК`,label:`Метаболическая активация`,tag:`ВНУТРИ ОРГАНИЗМА`,minutes:`4 мин`,title:`Молекула — начало.
Важны её превращения.`,lead:`Проследите путь от NDMA к реакционноспособным продуктам и аддуктам ДНК.`,notebook:`Активация и повреждение — разные этапы`,sourceIds:[`metabolic-activation`,`efsa-risk`,`fda-risk`],paragraphs:[`Для NDMA ключевой путь активации связан с ферментами цитохрома P450, прежде всего CYP2E1, и α-гидроксилированием. Нестабильный промежуточный продукт может давать реакционноспособные метилирующие частицы.`,`Они способны образовывать аддукты — химические модификации ДНК. Некоторые повреждения, если сохраняются и неправильно считываются, могут приводить к мутациям. Образование аддукта не равно неизбежному заболеванию.`,`Не все N-нитрозосоединения требуют одного механизма активации. Для разных веществ возможны разные пути, а итог зависит также от дозы, длительности воздействия и репарации ДНК. Это пример механизма для NDMA, не калькулятор индивидуального риска.`],takeaway:`Для понимания действия вещества важны его метаболиты, повреждения и их дальнейшая судьба.`,experiment:{title:`Проследите последовательность`,options:[{label:`1 · NDMA и активация`,tag:`ФЕРМЕНТАТИВНЫЙ ЭТАП`,formula:`NDMA → α-гидроксилирование`,message:`Для NDMA этот путь связан прежде всего с CYP2E1. Схема не означает, что любое вещество класса активируется одинаково.`},{label:`2 · Реакционноспособный продукт`,tag:`ПОСЛЕДУЮЩЕЕ ПРЕВРАЩЕНИЕ`,formula:`Промежуточный продукт → метилирующие частицы`,message:`Продукты распада α-гидроксиNDMA могут химически модифицировать ДНК. Между исходной молекулой и аддуктом есть несколько превращений.`},{label:`3 · Аддукт ДНК`,tag:`НЕ ИСХОД ЗАБОЛЕВАНИЯ`,formula:`ДНК → аддукт → возможная ошибка считывания`,message:`Дальнейшие последствия зависят от типа повреждения, репарации и других процессов. Аддукт, мутация и заболевание — разные понятия.`}]},questions:[{title:`Какой процесс важен для активации NDMA?`,text:`Речь о рассмотренном механизме, а не обо всех N-нитрозосоединениях.`,options:[`Только растворение в воде`,`Метаболическое α-гидроксилирование с участием P450`,`Только испарение`],answer:1,explanation:`Для NDMA описано α-гидроксилирование прежде всего с участием CYP2E1 и последующее образование реакционноспособных метилирующих продуктов.`},{title:`Аддукт ДНК означает неизбежный рак?`,text:`Различите химическое повреждение и исход заболевания.`,options:[`Да, это два названия одного события`,`Да, доза и репарация не влияют`,`Нет: аддукт, мутация и заболевание — разные этапы и понятия`],answer:2,explanation:`Некоторые аддукты могут приводить к ошибкам считывания и мутациям, но их судьба зависит от репарации и других факторов. Нельзя выводить индивидуальный риск из одной учебной схемы.`}]}],n={reviewedOnline:!0,reviewedOn:`13 октября 2026`,reviewedDate:`2026-10-13`,scope:`Сверены объяснения 12 этапов и 24 задания в трёх главах игры. Выбранные сведения из разделов II и III обзора сопоставлены с указанными источниками; остальные разделы и все исторические примеры не входят в эту проверку.`,book:`Костюковский Я. Л., Меламед Д. Б. «Канцерогенные N-нитрозамины. Образование, свойства, анализ». Успехи химии, т. 57, вып. 4, 1988, с. 625–655. Новый PDF содержит полный обзор. Использованы раздел II «Пути образования» (с. 626–635) и раздел III «Свойства» (с. 635–641).`,sources:[{id:`amine-classes`,number:1,name:`OpenStax · классификация аминов`,url:`https://chem.libretexts.org/Bookshelves/Organic_Chemistry/Organic_Chemistry_(OpenStax)/24%3A_Amines_and_Heterocycles/24.01%3A_Naming_Amines`,detail:`Organic Chemistry, §24.1 «Naming Amines». Класс определяется числом органических заместителей у азота. Страница LibreTexts обновлена 02.04.2025.`},{id:`primary-amines`,number:2,name:`OpenStax · диазотирование первичных аминов`,url:`https://chem.libretexts.org/Bookshelves/Organic_Chemistry/Organic_Chemistry_(OpenStax)/24%3A_Amines_and_Heterocycles/24.08%3A_Reactions_of_Arylamines`,detail:`Organic Chemistry, §24.8, «Diazonium Salts: The Sandmeyer Reaction». Различия алифатических и ароматических аминов. Страница обновлена 30.09.2024.`},{id:`fda-guidance`,number:3,name:`FDA · строение и пути образования`,url:`https://www.fda.gov/media/141720/download`,detail:`Control of Nitrosamine Impurities in Human Drugs, сентябрь 2024. §III.A, рис. 1, печатная с. 4 (страница PDF 9): фрагмент R¹R²N–N=O и схема образования. Это руководство для лекарств, не норматив для пищевых продуктов.`},{id:`pathways`,number:4,name:`Wichitnithad и соавт. · пути нитрозирования`,url:`https://pmc.ncbi.nlm.nih.gov/articles/PMC10023554/`,detail:`Saudi Pharmaceutical Journal 31(2), 2023, с. 295–311. §2 «Nitrosation pathways of nitrosamine formation». DOI: 10.1016/j.jsps.2022.12.010; онлайн-публикация 24.12.2022. Сверены классы аминов, pH и альтернативные пути.`},{id:`ph-nitrate`,number:5,name:`Eisenbrand и соавт. · pH и нитрат → нитрит`,url:`https://pmc.ncbi.nlm.nih.gov/articles/PMC11106120/`,detail:`Commentary of the SKLM to the EFSA opinion…, Archives of Toxicology 98, 2024, с. 1573–1580. Разделы «Formation of NOC in the stomach», «Exogenous nitrate exposure», «Extragastric NOC formation». DOI: 10.1007/s00204-024-03726-1. Исправление 10.1007/s00204-024-03776-5 проверено: касается лицензии, не механизмов.`},{id:`efsa-risk`,number:6,name:`EFSA · оценка N-нитрозаминов в пище`,url:`https://pmc.ncbi.nlm.nih.gov/articles/PMC10043641/`,detail:`EFSA CONTAM Panel, Risk assessment of N-nitrosamines in food, EFSA Journal 21(3):7884, 28.03.2023. §1.3.1–1.3.3, §1.3.5, таблица 1, §3.1 и §3.4: строение, предшественники, летучесть, ингибирование и оценка риска. DOI: 10.2903/j.efsa.2023.7884.`},{id:`fda-risk`,number:7,name:`FDA · доза, длительность и риск`,url:`https://www.fda.gov/drugs/drug-safety-and-availability/information-about-nitrosamine-impurities-medications`,detail:`Information about Nitrosamine Impurities in Medications. Разделы для пациентов и FAQ «What is the risk…». Дата актуальности страницы: 04.09.2024. Сверена связь риска с уровнем и длительностью воздействия; лекарственные пределы не перенесены на еду.`},...e]},r=[{id:`amines`,
